<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="shell auth-shell">
      <section class="hero">
        <p class="kicker">MentorApp</p>
        <h1>Learn Better Through Beautiful Feedback</h1>
        <p class="subtitle">
          Assign real coding projects, submit solutions, receive corrected code,
          grades, and clear mistake highlights.
        </p>
      </section>

      <section class="glass card-tabs">
        <div class="tabs">
          <button class="tab-btn active" data-target="login-form">Login</button>
          <button class="tab-btn" data-target="register-form">Register</button>
        </div>

        <form id="login-form" class="form active" autocomplete="on">
          <label>University Email</label>
          <input id="login-email" type="email" placeholder="name@studio.unibo.it" required />

          <label>Password</label>
          <input id="login-password" type="password" placeholder="Enter password" required />

          <label>Role</label>
          <div class="role-grid">
            <label><input type="radio" name="login-role" value="student" checked /> Student</label>
            <label><input type="radio" name="login-role" value="professor" /> Professor</label>
          </div>

          <button type="submit" class="btn btn-primary">Enter Dashboard</button>
        </form>

        <form id="register-form" class="form" autocomplete="on">
          <label>University Email</label>
          <input id="register-email" type="email" placeholder="name@studio.unibo.it" required />

          <label>Full Name</label>
          <input id="register-name" type="text" placeholder="Your full name" required />

          <label>Student ID (required for students)</label>
          <input id="register-student-id" type="text" placeholder="e.g. S123456" />

          <label>Password</label>
          <input id="register-password" type="password" placeholder="At least 6 characters" required />

          <label>Role</label>
          <div class="role-grid">
            <label><input type="radio" name="register-role" value="student" checked /> Student</label>
            <label><input type="radio" name="register-role" value="professor" /> Professor</label>
          </div>

          <button type="submit" class="btn btn-secondary">Create Account</button>
        </form>

        <p id="auth-message" class="status"></p>
      </section>
    </main>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/login.js"></script>
  </body>
</html>
